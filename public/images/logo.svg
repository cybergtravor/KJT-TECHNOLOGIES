<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" class="w-auto h-10">
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="kjt-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="kjt-shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <!-- Cyber Shield Emblem -->
  <g transform="translate(6, 6)">
    <!-- Hexagonal Shield Outer -->
    <polygon points="26,2 48,12 48,36 26,50 4,36 4,12" fill="url(#kjt-shield-grad)" stroke="url(#kjt-blue-grad)" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Cyber Security Circuit Lines -->
    <path d="M 26 10 L 26 24 M 14 20 L 26 26 L 38 20 M 26 26 L 26 42" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="26" cy="26" r="3" fill="#ffffff" />
    <circle cx="14" cy="20" r="2" fill="#00d2ff" />
    <circle cx="38" cy="20" r="2" fill="#00d2ff" />
    <circle cx="26" cy="42" r="2" fill="#00d2ff" />
  </g>

  <!-- Typography -->
  <g transform="translate(68, 12)">
    <!-- Main Acronym "KJT" -->
    <text x="0" y="26" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="800" font-size="26" fill="#0f172a" letter-spacing="1.5">
      KJT
    </text>
    <text x="56" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="16" fill="#0284c7" letter-spacing="3.5">
      TECHNOLOGIES
    </text>
    
    <!-- Tagline/Motto subtitle snippet -->
    <text x="1" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="8.5" fill="#64748b" letter-spacing="1">
      INNOVATION &amp; DATA SECURITY
    </text>
  </g>
</svg>
