<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 150' width='600' height='150'>
  <defs>
    <linearGradient id='cyanBlueGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#00D4FF'/>
      <stop offset='100%' stop-color='#0055FF'/>
    </linearGradient>
    <linearGradient id='shieldGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0F284E'/>
      <stop offset='100%' stop-color='#071324'/>
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem: Shield + Hexagon + Circuit Nodes -->
  <g transform='translate(15, 15)'>
    <!-- Outer Shield Frame -->
    <path d='M60 5 L110 32 V75 C110 102 60 115 60 115 C60 115 10 102 10 75 V32 Z' fill='url(#shieldGrad)' stroke='url(#cyanBlueGrad)' stroke-width='4' stroke-linejoin='round'/>
    <!-- Inner Cyber Core -->
    <polygon points='60,25 90,42 90,78 60,95 30,78 30,42' fill='none' stroke='#00D4FF' stroke-width='2.5' stroke-dasharray='4,2'/>
    <!-- Center Monogram KJT Node -->
    <circle cx='60' cy='60' r='12' fill='url(#cyanBlueGrad)'/>
    <path d='M60 25 L60 48 M60 72 L60 95 M30 42 L48 53 M90 42 L72 53 M30 78 L48 67 M90 78 L72 67' stroke='#00D4FF' stroke-width='2' stroke-linecap='round'/>
    <path d='M55 54 L65 54 M60 54 L60 66 M56 66 L64 66' stroke='#ffffff' stroke-width='2.5' stroke-linecap='round'/>
  </g>

  <!-- Brand Typography -->
  <text x='150' y='68' font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif' font-size='42' font-weight='900' fill='#ffffff' letter-spacing='2'>
    KJT <tspan fill='#00D4FF'>TECHNOLOGIES</tspan>
  </text>
  <text x='152' y='100' font-family='system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif' font-size='14' font-weight='600' fill='#94A3B8' letter-spacing='3'>
    ACCELERATING INNOVATION &bull; SECURING DATA
  </text>
</svg>